name: Docs

# Builds the VitePress site in site/, so a dead link fails before merge. The site is published by the
# Fly deploy: the Docker image builds it and the web process serves it on shapi.dev.
on:
  pull_request:
    paths: ["site/**", "advisories/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", "advisories/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # lastUpdated on each page comes from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # No root prepare script (it would build every package): only @shapi/core, which the advisory pages' Markdown
      # twins are written with (site/scripts/advisory-twins.ts).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @shapi/core build
      - run: pnpm --filter @shapi/site docs:build
