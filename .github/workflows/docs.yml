name: Docs

# Builds the VitePress site in site/ and publishes it to GitHub Pages.
# Pull requests only build it, so a dead link fails before merge.
on:
  pull_request:
    paths: ["site/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
  # Daily, so the landing page's deadline list and "in N days" stay current.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # lastUpdated on each page comes from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Only the site's dependencies; the root prepare script would build every package.
      - run: pnpm install --frozen-lockfile --filter @shapi/site --ignore-scripts
      - run: pnpm --filter @shapi/site docs:build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
