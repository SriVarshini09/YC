name: Deploy

# Deploys main to Fly.io once CI has passed on that commit. Does nothing until the FLY_API_TOKEN repository
# secret is set. The token is given only to the deploy step.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "FLY_API_TOKEN not set; skipping deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ env.SHA }}
      - if: env.HAS_TOKEN == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - if: env.HAS_TOKEN == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --build-arg GIT_SHA="$SHA"
