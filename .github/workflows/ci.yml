name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Install also builds every package (root `prepare` script).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Tests start a real Postgres via embedded-postgres; no service container needed.
      - run: pnpm test
      # Actions run with the workflow's permissions and secrets: never one that follows a moving branch.
      - name: No action pinned to a branch
        run: "! grep -rnE 'uses: *[^ ]+@(master|main)( |$)' .github/workflows"

  bench:
    # APIBreak-Replay as the matcher's regression suite (execution plan P-05): scan every in-scope instance at
    # its base and fix commits and fail when SHAPI loses a catch or flags a fix commit it accepted before
    # (packages/bench/baseline.json). Archives are cached: a commit's archive never changes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: packages/bench/.cache
          key: bench-archives-${{ hashFiles('packages/bench/datasets/apibreak-v0.json') }}
      # Read-only: the token only downloads public archives through GitHub's API (60 an hour without one).
      - run: pnpm --filter @shapi/bench bench:run -- --cache .cache --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  npm-package:
    # Build the publishable shapi-cli package, install it into an empty folder and run scan and fix, on the
    # oldest Node it supports and the current LTS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["22.14", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-ts.mjs packages/cli/scripts/build-npm.ts
      # The package is built on 24 and installed and run on the matrix version.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Node 22.14 strips types only behind a flag, which run-ts.mjs adds when needed.
      - run: node scripts/run-ts.mjs packages/cli/scripts/smoke-npm.ts

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t shapi-server:ci .
      - name: Smoke-test the image
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=pw postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          URL=postgres://postgres:pw@pg:5432/postgres
          ENV="-e DATABASE_URL=$URL -e SHAPI_SHAPE_SECRET=ci"
          docker run --rm --network smoke $ENV shapi-server:ci node dist/migrate.js
          # The web process as fly.toml runs it, with the docs site on its own host.
          docker run -d --name web --network smoke -p 8080:8080 $ENV -e SHAPI_DOCS_URL=https://shapi.dev -e SHAPI_DOCS_DIR=/app/docs shapi-server:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/readyz
          curl -fs localhost:8080/version | grep -q '"${{ github.sha }}"'
          curl -fs -H 'Host: shapi.dev' localhost:8080/guide/cli | grep -q 'CLI reference'
          # The worker: it must start and still be running a few seconds later.
          docker run -d --name worker --network smoke $ENV shapi-server:ci node dist/worker.js
          for i in $(seq 1 30); do docker logs worker 2>&1 | grep -q '"worker started"' && break; sleep 1; done
          sleep 5
          docker logs worker
          docker logs worker 2>&1 | grep -q '"worker started"'
          test "$(docker inspect -f '{{.State.Running}}' worker)" = true
