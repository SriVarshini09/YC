# Fly.io deployment for SHAPI. Set `app` to the name you create with `fly apps create`.
app = "shapi"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Database migrations run once per deploy, before new machines start.
  release_command = "node dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"

[processes]
  web = "node dist/web.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]
