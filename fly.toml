# Fly.io deployment for SHAPI ("shapi" was taken on Fly, so the app is shapi-app).
app = "shapi-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Database migrations run once per deploy, before new machines start.
  release_command = "node dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  # The public advisory database; the worker syncs it hourly and on start.
  SHAPI_ADVISORIES_REPO = "SriVarshini09/shapi-advisories"
  # Where GitHub sign-in and Stripe send people back to.
  SHAPI_PUBLIC_URL = "https://app.shapi.dev"
  # The docs site, built into the image: requests for shapi.dev (and www.) are served from it.
  SHAPI_DOCS_URL = "https://shapi.dev"
  SHAPI_DOCS_DIR = "/app/docs"

[processes]
  web = "node dist/web.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

# Scans run on the worker, each in its own process with a 640 MB heap (DEFAULT_SCAN_LIMITS in jobs/scan.ts).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
